<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Мои предпочтения{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="nav">
  <nav class="nav-inner">
    <a class="brand" href="{{ url_for('index') }}">Любимое</a>
    <ul class="nav-links">
      {% for key, name in categories.items() %}<li><a href="{{ url_for('category', category=key) }}" {% if key == request.view_args.get('category') %}class="active"{% endif %}>{{ name }}</a></li>{% endfor %}
      <li><a class="pill" href="{{ url_for('add') }}">Добавить</a></li>
    </ul>
  </nav>
</header>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
