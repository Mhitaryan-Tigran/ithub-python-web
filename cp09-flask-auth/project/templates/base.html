<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Flask Auth{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="nav">
  <nav class="nav-inner">
    <a class="brand" href="{{ url_for('main.index') }}">Flask Auth</a>
    <ul class="nav-links">
      <li><a href="{{ url_for('main.index') }}">Главная</a></li>
      {% if current_user.is_authenticated %}
      <li><a href="{{ url_for('main.profile') }}">Профиль</a></li>
      <li><a href="{{ url_for('auth.logout') }}">Выйти</a></li>
      {% else %}
      <li><a href="{{ url_for('auth.login') }}">Войти</a></li>
      <li><a class="pill" href="{{ url_for('auth.signup') }}">Регистрация</a></li>
      {% endif %}
    </ul>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
