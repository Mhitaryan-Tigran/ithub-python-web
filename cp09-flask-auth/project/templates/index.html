{% extends "base.html" %}
{% block content %}
<p class="eyebrow">Flask-Login</p>
<h1>Аутентификация во Flask.</h1>
<p class="lede">Зарегистрируйтесь, войдите и откройте профиль. Без входа страница профиля недоступна.</p>
<div class="actions">
  {% if current_user.is_authenticated %}
  <a class="button" href="{{ url_for('main.profile') }}">Открыть профиль</a>
  {% else %}
  <a class="button" href="{{ url_for('auth.signup') }}">Создать аккаунт</a>
  <a class="button plain" href="{{ url_for('auth.login') }}">Войти</a>
  {% endif %}
</div>
{% endblock %}
