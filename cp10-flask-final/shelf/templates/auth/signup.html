{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Регистрация</h1>
  <form class="stack card" method="post" style="margin-top: 24px">
    <label>Имя <input name="name" autocomplete="name" required autofocus value="{{ request.form.name }}"></label>
    <label>Почта <input type="email" name="email" autocomplete="email" required value="{{ request.form.email }}"></label>
    <label>Пароль <input type="password" name="password" autocomplete="new-password" minlength="6" required></label>
    <button type="submit">Завести полку</button>
  </form>
  <p class="muted">Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войдите</a></p>
</div>
{% endblock %}
