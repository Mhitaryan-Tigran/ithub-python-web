{% load static %}
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Резюме{% endblock %}</title>
<link rel="stylesheet" href="{% static 'style.css' %}">
<style>
  .head { display: flex; align-items: center; gap: 24px; }
  .avatar { display: grid; place-items: center; width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(160deg, #e8f1ff, #cfe2ff); color: #0071e3; font-size: 36px; font-weight: 700; flex: none; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { padding: 4px 10px; border-radius: 999px; background: var(--fill); font-size: 13px; }
  @media (max-width: 640px) { .head { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<header class="nav">
  <nav class="nav-inner">
    <a class="brand" href="{% url 'home' %}">Тигран Мхитарян</a>
    <ul class="nav-links">
      <li><a href="{% url 'home' %}" {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>Резюме</a></li>
      <li><a href="{% url 'about' %}" {% if request.resolver_match.url_name == 'about' %}class="active"{% endif %}>О сайте</a></li>
    </ul>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
