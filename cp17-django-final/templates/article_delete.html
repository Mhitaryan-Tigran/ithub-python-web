{% extends "base.html" %}
{% block title %}Удалить статью{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Удалить статью?</h1>
  <p class="lede">«{{ article.title }}» и все комментарии к ней будут удалены.</p>
  <form method="post">{% csrf_token %}<div class="actions"><button class="button danger" type="submit">Удалить</button><a class="button plain" href="{{ article.get_absolute_url }}">Отмена</a></div></form>
</div>
{% endblock %}
