{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Вход</h1>
  <form class="stack card form-card" method="post" style="margin-top: 24px">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Войти</button>
  </form>
  <p class="muted">Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрируйтесь</a> · <a href="{% url 'password_reset' %}">Забыли пароль?</a></p>
</div>
{% endblock %}
