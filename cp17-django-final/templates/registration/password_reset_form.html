{% extends "base.html" %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Восстановление пароля</h1>
  <p class="lede">Укажите почту — пришлём ссылку для нового пароля. В учебной версии письмо выводится в консоль сервера.</p>
  <form class="stack card form-card" method="post">{% csrf_token %}{{ form.as_div }}<button type="submit">Отправить ссылку</button></form>
</div>
{% endblock %}
