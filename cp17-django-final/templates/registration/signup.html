{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Регистрация</h1>
  <form class="stack card form-card" method="post" style="margin-top: 24px">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Создать аккаунт</button>
  </form>
  <p class="muted">Уже есть аккаунт? <a href="{% url 'login' %}">Войдите</a></p>
</div>
{% endblock %}
